# ============================================================================
#  Auto-create the Oracle Always Free A1 server — 100% hands-off
# ----------------------------------------------------------------------------
#  Each run hunts for ~5.5 HOURS on GitHub's own servers (retrying every
#  ~45 s across all availability domains), then chains the next run.
#  The moment Oracle frees a slot, your server is created with the exact
#  GUIDE.md Part 4 spec and a RESERVED public IP, and this workflow
#  disables itself.
#
#  Why ~6-hour runs instead of short 10-minute runs? Observed in the wild:
#  GitHub silently swallows the self-dispatch after ~300 rapid chains
#  (the chain died on 2025-11-25 after 317 runs). Long runs mean only
#  ~4 dispatches/day — far below any abuse threshold. The dispatch is
#  also VERIFIED and retried, an external watchdog monitors the chain,
#  and GitHub's own cron is kept as a final safety net.
#
#  It starts working as soon as the required secrets exist
#  (Settings -> Secrets and variables -> Actions — see AUTO-CREATE.md).
#  Until then every run exits with a clear "paused" message.
#
#  NOTE: this repo is PUBLIC on purpose — public repos get UNLIMITED free
#  GitHub Actions minutes, which is what allows 24/7 hunting. If you ever
#  switch the repo to private, this 6-hour pattern would exceed the 2,000
#  free minutes/month — go back to short runs instead.
# ============================================================================

name: Auto-create A1 instance

on:
  schedule:
    - cron: "*/30 * * * *"   # safety net only — the chain + watchdog do the real work
  workflow_dispatch: {}       # also adds a manual "Run workflow" button

permissions:
  contents: read
  actions: write              # lets the script disable this workflow after success

concurrency:
  group: auto-create-a1       # never two overlapping hunts

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # ~5h50m hard cap (GitHub max is 6h)

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Oracle SDK
        run: pip install -r requirements.txt

      - name: Hunt for capacity (and create the server when a slot opens)
        run: python auto_create.py
        env:
          # ── credentials: GitHub Secrets (see AUTO-CREATE.md) ─────────────
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          # ── optional Telegram alert when the server lands ────────────────
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ── needed so the script can disable this workflow after success ─
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── server spec (edit HERE — defaults match GUIDE.md Part 4) ─────
          SHAPE: VM.Standard.A1.Flex
          OCPUS: "2"
          MEMORY_GBS: "12"
          BOOT_GB: "200"
          DISPLAY_NAME: coolify-server
          IMAGE_OS: "Canonical Ubuntu"
          IMAGE_OS_VERSION: "24.04"
          RESERVED_IP_NAME: coolify-reserved-ip
          ROUNDS: "420"          # 420 rounds × ~45 s ≈ 5h20m of hunting per run
          ROUND_SLEEP: "40"      # seconds between rounds
          WORKFLOW_FILE: auto-create.yml
